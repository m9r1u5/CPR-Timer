name: Build CPR Timer APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        run: |
          set -e
          P=apk/app/src/main
          mkdir -p $P/java/com/cprtimer/app $P/assets $P/res/mipmap-xxxhdpi
          cp index.html $P/assets/index.html
          cp icon-192.png $P/res/mipmap-xxxhdpi/ic_launcher.png

          cat > apk/settings.gradle <<'EOF1'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "CPRTimer"
          include ':app'
          EOF1

          cat > apk/build.gradle <<'EOF2'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF2

          cat > apk/gradle.properties <<'EOF3'
          org.gradle.jvmargs=-Xmx2g
          EOF3

          cat > apk/app/build.gradle <<'EOF4'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.cprtimer.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.cprtimer.app'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF4

          cat > $P/AndroidManifest.xml <<'EOF5'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application android:label="CPR Timer" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.Material.NoActionBar" android:allowBackup="false">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF5

          cat > $P/java/com/cprtimer/app/MainActivity.java <<'EOF6'
          package com.cprtimer.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            WebView w;

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              getWindow().setStatusBarColor(Color.BLACK);
              getWindow().setNavigationBarColor(Color.BLACK);
              w = new WebView(this);
              w.setBackgroundColor(Color.BLACK);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              w.setWebViewClient(new WebViewClient());
              w.addJavascriptInterface(new Bridge(), "AndroidApp");
              setContentView(w);
              w.loadUrl("file:///android_asset/index.html");
            }

            class Bridge {
              @JavascriptInterface public void share(final String url) {
                runOnUiThread(new Runnable() { public void run() {
                  Intent i = new Intent(Intent.ACTION_SEND);
                  i.setType("text/plain");
                  i.putExtra(Intent.EXTRA_SUBJECT, "CPR Timer");
                  i.putExtra(Intent.EXTRA_TEXT, url);
                  startActivity(Intent.createChooser(i, "Share CPR Timer"));
                }});
              }

              @JavascriptInterface public void vibrate(String csv) {
                try {
                  String[] p = csv.split(",");
                  long[] a = new long[p.length + 1];
                  for (int k = 0; k < p.length; k++) a[k + 1] = Long.parseLong(p[k].trim());
                  Vibrator v = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) v.vibrate(VibrationEffect.createWaveform(a, -1));
                  else v.vibrate(a, -1);
                } catch (Exception e) { }
              }
            }

            @Override public void onBackPressed() { finish(); }
          }
          EOF6

      - name: Build APK
        working-directory: apk
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp apk/app/build/outputs/apk/debug/app-debug.apk CPR-Timer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CPR-Timer-apk
          path: CPR-Timer.apk

      - name: Publish release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "apk-${{ github.run_number }}" CPR-Timer.apk --title "CPR Timer APK ${{ github.run_number }}" --notes "Download CPR-Timer.apk below and install it."
