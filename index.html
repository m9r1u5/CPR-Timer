<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>CPR Timer</title>
<link rel="manifest" href="manifest.json">
<script>window.__dp=null;addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__dp=e});</script>
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#000;--fg:#fff;--dim:#9aa0a6;--s:#4cc9f0;--l:#ffb703;--bad:#ff4d4d;--line:#2a2a2a;--d:min(calc((100vw - 36px)/2),240px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;gap:10px;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
.dial{position:relative;width:var(--d);height:var(--d);border:0;background:none;padding:0;color:var(--fg);flex:none;cursor:pointer}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:9}
.dial .bg{stroke:var(--line)}
.dial .fg{stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3}
.dial .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-variant-numeric:tabular-nums}
.t{font-size:calc(var(--d)*.25);line-height:1}
.lbl{font-size:calc(var(--d)*.095);font-weight:700;margin-bottom:6px;white-space:nowrap}
#sess .lbl{color:var(--s)}#lap .lbl{color:var(--l)}
.sub{font-size:calc(var(--d)*.09);color:var(--dim);font-weight:600;margin-top:4px}
#sess .fg{stroke:var(--s)}#lap .fg{stroke:var(--l)}
.dial:disabled{opacity:.35}
.dial.done .fg{stroke:var(--bad)}
.dials{display:flex;gap:12px;justify-content:center;flex:none}
#laps{flex:1;min-height:60px;overflow-y:auto;border:2px solid var(--line);border-radius:14px;padding:4px 14px;list-style:none;margin:0;font-size:18px;font-variant-numeric:tabular-nums}
#laps li{display:flex;justify-content:space-between;gap:6px;padding:5px 0;border-bottom:1px solid var(--line)}
#laps li:last-child{border:0}
#laps .e{color:var(--dim);justify-content:center;border:0;padding-top:20px;text-align:center}
#met{display:flex;flex-direction:column;gap:2px;flex:none}
#met .r{display:flex;gap:8px;align-items:center}
#met button{min-height:40px;border-radius:12px;border:2px solid var(--fg);background:#111;color:var(--fg);font-size:22px;font-weight:800}
#bm,#bp{width:52px;flex:none}
#bw{flex:1;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
#bw b{font-size:26px}#bw span{font-size:14px;color:var(--dim);font-weight:700;margin-left:4px}
#mtog{width:90px;flex:none;font-size:14px}
#mtog.on{background:var(--l);color:#000;border-color:var(--l)}
#mtog.hit{background:#fff}
#bs{width:100%;height:22px;margin:0;accent-color:var(--l)}
#ccf{display:flex;justify-content:space-between;align-items:baseline;border:2px solid var(--line);border-radius:14px;padding:4px 14px;flex:none}
#ccf b{font-size:28px;color:var(--l);font-variant-numeric:tabular-nums}
#ccf span{font-size:16px;color:var(--dim);font-weight:600}
.btns{display:flex;gap:8px;flex:none}
.btns button{flex:1;min-height:44px;border-radius:12px;border:2px solid var(--fg);background:#111;color:var(--fg);font-size:14px;font-weight:800;letter-spacing:.04em}
.btns button:active{background:#333}
#reset{border-color:var(--bad);color:var(--bad)}
.btns #stop{background:var(--bad);border-color:var(--bad);color:#000}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:24px;z-index:9}
#dlg div{background:#111;border:2px solid var(--fg);border-radius:16px;padding:20px;width:100%;max-width:340px;text-align:center;font-size:18px;font-weight:700}
#dlg p{margin:0 0 16px}
#dlg .b{display:flex;gap:10px}
#dlg button{flex:1;min-height:48px;border-radius:12px;border:2px solid var(--fg);background:#111;color:var(--fg);font-size:16px;font-weight:800}
#dlg #dy{background:var(--bad);border-color:var(--bad);color:#000}
#msg{position:fixed;left:12px;right:12px;bottom:84px;background:#fff;color:#000;padding:12px 14px;border-radius:12px;font-weight:600;display:none;text-align:center;white-space:pre-line}
</style>
</head>
<body>
<div class="dials">
<button class="dial" id="sess" aria-label="Session timer">
  <svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="sr" cx="60" cy="60" r="54"/></svg>
  <div class="txt"><div class="lbl">Resus</div><div class="t" id="st">00:00</div><div class="sub" id="ss">Tap to start</div></div>
</button>
<button class="dial" id="lap" aria-label="Compression lap timer">
    <svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="lr" cx="60" cy="60" r="54"/></svg>
    <div class="txt"><div class="lbl">Time on Chest</div><div class="t" id="lt">00:00</div><div class="sub" id="ls">Tap to start</div></div>
  </button>
</div>
<ul id="laps"></ul>
<div id="met">
  <div class="r"><button id="bm" aria-label="Slower">−</button><div id="bw"><b id="bpm">110</b><span>BPM</span></div><button id="bp" aria-label="Faster">+</button><button id="mtog">START</button></div>
  <input id="bs" type="range" min="100" max="120" step="1" value="110" aria-label="Compressions per minute">
</div>
<div id="ccf"><span>CCF</span><b id="cv">0%</b></div>
<div class="btns">
  <button id="stop">STOP</button>
  <button id="reset">RESET</button>
  <button id="install">INSTALL</button>
  <button id="share">SHARE</button>
</div>
<div id="msg"></div>
<div id="dlg"><div><p id="dq"></p><div class="b"><button id="dn">Cancel</button><button id="dy">Reset</button></div></div></div>
<script>
const $=id=>document.getElementById(id), C=339.3, MAX=600000;
const S={on:false,start:0,done:false,el:0,why:''}, L={on:false,start:0,acc:0,laps:[]};
let ctx=null, lock=null, dp=null;
const met={on:false,bpm:110,next:0,h:null,n:0};
const mmss=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const ring=(id,f)=>$(id).style.strokeDashoffset=C*(1-Math.min(1,f));
const buzz=p=>{try{if(window.AndroidApp){AndroidApp.vibrate([].concat(p).join(','))}else if(navigator.vibrate)navigator.vibrate(p)}catch(e){}};
function audio(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}}
function alarm(){
  audio(); if(ctx){for(let i=0;i<6;i++){const t=ctx.currentTime+i*.4,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='square';o.frequency.value=i%2?660:990;g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);
    o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.32)}}
  buzz([500,150,500,150,500,150,900]);
}
async function wake(){
  const need=S.on||L.on||met.on;
  try{
    if(need&&!lock&&'wakeLock' in navigator&&document.visibilityState==='visible'){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>lock=null)}
    else if(!need&&lock){await lock.release();lock=null}
  }catch(e){}
}
function render(){
  const now=Date.now(), el=S.on?Math.min(MAX,now-S.start):S.el;
  $('st').textContent=mmss(el); ring('sr',el/MAX);
  $('ss').textContent=S.done?(S.why==='stop'?'Stopped':'Time up'):S.on?'Running':'Tap to start';
  $('sess').classList.toggle('done',S.done&&S.why==='up');
  const lt=L.acc+(L.on?now-L.start:0);
  $('lt').textContent=mmss(lt); ring('lr',(lt%60000)/60000);
  $('ls').textContent=S.done?'Stopped':L.on?'Tap to record lap':(L.laps.length?'Tap to resume':'Tap to start');
  $('lap').disabled=S.done;
  $('cv').textContent=Math.min(100,Math.round(lt/MAX*100))+'%';
}
function setBpm(v){
  met.bpm=Math.max(100,Math.min(120,Math.round(v)));
  $('bpm').textContent=met.bpm;$('bs').value=met.bpm;
  try{localStorage.setItem('bpm',met.bpm)}catch(e){}
}
let mg=null,nb=null;
function out(){
  if(mg)return mg;
  const c=ctx.createDynamicsCompressor();
  c.threshold.value=-6;c.knee.value=0;c.ratio.value=20;c.attack.value=.001;c.release.value=.05;
  mg=ctx.createGain();mg.gain.value=3.2;mg.connect(c);c.connect(ctx.destination);
  nb=ctx.createBuffer(1,Math.round(ctx.sampleRate*.06),ctx.sampleRate);
  const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  return mg;
}
function env(g,t,pk,dec){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(pk,t+.001);g.gain.exponentialRampToValueAtTime(.0001,t+dec)}
function click(t){
  const m=out();
  const nz=(at,fr,q,pk,dec)=>{const s=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),g=ctx.createGain();
    s.buffer=nb;bp.type='bandpass';bp.frequency.value=fr;bp.Q.value=q;env(g,at,pk,dec);
    s.connect(bp).connect(g).connect(m);s.start(at)};
  nz(t,3200,.9,1,.025);
  nz(t+.011,1900,1.2,.6,.03);
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='triangle';o.frequency.setValueAtTime(1400,t);o.frequency.exponentialRampToValueAtTime(1050,t+.03);
  env(g,t,.8,.07);o.connect(g).connect(m);o.start(t);o.stop(t+.08);
  const o3=ctx.createOscillator(),g3=ctx.createGain();
  o3.frequency.value=160;env(g3,t,.35,.05);o3.connect(g3).connect(m);o3.start(t);o3.stop(t+.06);
  setTimeout(()=>{const b=$('mtog');b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),70)},Math.max(0,(t-ctx.currentTime)*1000));
}
function sched(){
  if(!ctx||!met.on)return;
  const ahead=document.hidden?2.5:.15;
  while(met.next<ctx.currentTime+ahead){click(met.next);met.next+=60/met.bpm}
}
function metUI(){const b=$('mtog');b.textContent=met.on?'STOP':'START';b.classList.toggle('on',met.on)}
function metStart(){audio();if(!ctx)return;met.on=true;met.n=0;met.next=ctx.currentTime+.05;sched();met.h=setInterval(sched,25);metUI();wake()}
function metStop(){met.on=false;clearInterval(met.h);metUI();wake()}
$('mtog').onclick=()=>met.on?metStop():metStart();
$('bm').onclick=()=>setBpm(met.bpm-1);
$('bp').onclick=()=>setBpm(met.bpm+1);
$('bs').oninput=e=>setBpm(+e.target.value);
try{const b=+localStorage.getItem('bpm');if(b>=100&&b<=120)met.bpm=b}catch(e){}
setBpm(met.bpm);
function tick(){
  if(S.on&&Date.now()-S.start>=MAX)finish();
  render();
}
function finish(){
  const now=Date.now(); S.on=false;S.done=true;S.el=MAX;S.why='up';
  if(L.on){L.acc+=now-L.start;L.on=false}
  metStop();alarm();wake();
}
$('sess').onclick=()=>{audio();if(S.on||S.done)return;S.on=true;S.start=Date.now();buzz(30);wake();render()};
$('lap').onclick=()=>{
  audio();if(S.done)return;const now=Date.now();
  if(!L.on){L.on=true;L.start=now}
  else{const d=now-L.start;L.acc+=d;L.on=false;L.laps.push(d);addLap(L.laps.length,d)}
  buzz(30);wake();render();
};
function addLap(n,d){
  const ul=$('laps'),e=ul.querySelector('.e'),li=document.createElement('li');
  if(e)e.remove();
  li.innerHTML='<span>Lap '+n+'</span><b>'+(d/1000).toFixed(1)+' s</b>';
  ul.appendChild(li);ul.scrollTop=ul.scrollHeight;
}
function clearLaps(){$('laps').innerHTML='<li class="e">Laps appear here</li>';}
function ask(q,yes){
  $('dq').textContent=q;$('dlg').style.display='flex';
  $('dn').onclick=()=>$('dlg').style.display='none';
  $('dy').onclick=()=>{$('dlg').style.display='none';yes()};
}
function doReset(){
  clearInterval(met.h);met.on=false;metUI();
  S.on=false;S.done=false;S.start=0;S.el=0;S.why='';
  L.on=false;L.acc=0;L.start=0;L.laps=[];
  clearLaps();wake();render();
}
$('reset').onclick=()=>ask('Reset both timers, laps and CCF?',doReset);
$('stop').onclick=()=>{
  if(!(S.on||L.on||met.on))return;
  const now=Date.now();
  if(S.on)S.el=Math.min(MAX,now-S.start);
  if(L.on)L.acc+=now-L.start;
  S.on=false;L.on=false;S.done=true;S.why='stop';
  metStop();buzz(60);wake();render();
};
function toast(t,ms){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>m.style.display='none',ms||6000)}
async function diag(){
  const L=[location.protocol==='https:'?'✓ Secure link (https)':'✗ Not https: open the github.io link in Chrome'];
  try{const g=await navigator.serviceWorker.getRegistration();L.push(g&&g.active?'✓ Offline engine active':'✗ Offline engine not active: reload once')}catch(e){L.push('✗ Offline engine unavailable')}
  for(const f of ['manifest.json','icon-192.png','icon-512.png']){try{const r=await fetch(f,{cache:'no-store'});L.push((r.ok?'✓ ':'✗ missing: ')+f)}catch(e){L.push('✗ cannot load '+f)}}
  L.push('Chrome has not offered install yet. Use menu ⋮ > Install app.');
  toast(L.join('\n'),15000);
}
window.addEventListener('appinstalled',()=>{$('install').style.display='none';window.__dp=null});
if(matchMedia('(display-mode: standalone)').matches||window.AndroidApp)$('install').style.display='none';
$('install').onclick=async()=>{
  const e=window.__dp;
  if(e){
    window.__dp=null;e.prompt();
    const r=await e.userChoice;
    if(r.outcome==='accepted')$('install').style.display='none';
    else toast('Install cancelled. You can install any time from the Chrome menu (⋮) > Install app.');
    return;
  }
  diag();
};
$('share').onclick=async()=>{
  const url=location.protocol==='file:'?'https://m9r1u5.github.io/cpr-timer/':location.href.split('#')[0],data={title:'CPR Timer',text:'Offline CPR timer',url};
  if(window.AndroidApp){AndroidApp.share(url);return}
  try{if(navigator.share){await navigator.share(data);return}}catch(e){if(e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);toast('Link copied')}catch(e){toast(url)}
};
document.addEventListener('visibilitychange',()=>{tick();wake()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
clearLaps();render();setInterval(tick,250);
</script>
</body>
</html>
